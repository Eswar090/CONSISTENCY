spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/consistency?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration — change secret in production via env var APP_JWT_SECRET
app.jwt.secret=${APP_JWT_SECRET:consistency-app-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Twilio SMS Provider (Phase 12)
sms.twilio.account-sid=${SMS_TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${SMS_TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${SMS_TWILIO_FROM_NUMBER:}

# Smart Alerts
app.smart-alerts.enabled=${SMART_ALERTS_ENABLED:true}


